<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyCalendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans h-full flex flex-col transition-colors duration-200"
  >
    <header
      class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-3 flex flex-wrap items-center justify-between gap-4 shadow-sm z-10"
    >
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2">
          <div
            class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md"
          >
            M
          </div>
          <h1
            class="text-xl font-bold tracking-tight text-slate-800 dark:text-white"
          >
            MyCalendar
          </h1>
        </div>

        <button
          id="todayBtn"
          class="px-3 py-1.5 text-sm font-medium bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition-colors"
        >
          Today
        </button>

        <div class="flex items-center space-x-1">
          <button
            id="prevMonth"
            class="p-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>
          <button
            id="nextMonth"
            class="p-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>

        <h2
          id="currentMonthYear"
          class="text-lg font-semibold text-slate-700 dark:text-slate-200 min-w-[160px]"
        ></h2>
      </div>

      <div class="flex-1 max-w-xs relative hidden md:block">
        <input
          type="text"
          id="searchInput"
          placeholder="Search events..."
          class="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-slate-100 placeholder-slate-400"
        />
        <svg
          class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </div>

      <div class="flex items-center space-x-3">
        <button
          id="darkModeToggle"
          class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors"
          title="Toggle Theme"
        >
          <svg
            id="themeMoon"
            class="w-5 h-5 hidden dark:block"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          <svg
            id="themeSun"
            class="w-5 h-5 block dark:hidden"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        </button>

        <button
          id="openModalBtn"
          class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors flex items-center space-x-1.5"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
          <span>New Event</span>
        </button>
      </div>
    </header>

    <div
      class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-2 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400"
    >
      <div class="flex space-x-4">
        <span
          >Total Events:
          <strong id="statTotal" class="text-slate-800 dark:text-slate-200"
            >0</strong
          ></span
        >
        <span
          >This Month:
          <strong id="statMonth" class="text-slate-800 dark:text-slate-200"
            >0</strong
          ></span
        >
      </div>
    </div>
    <main class="flex-1 flex flex-col p-4 sm:p-6 overflow-hidden">
      <div
        class="grid grid-cols-7 gap-px mb-1 text-center text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400"
      >
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>
      <div
        id="calendarGrid"
        class="flex-1 grid grid-cols-7 grid-rows-6 gap-px bg-slate-200 dark:bg-slate-700 rounded-xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700"
      ></div>
    </main>

    <div
      id="eventModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden flex items-center justify-center z-50"
    >
      <div
        class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-md p-6 relative border border-slate-100 dark:border-slate-700"
      >
        <h3
          id="modalTitle"
          class="text-lg font-bold text-slate-800 dark:text-white mb-4"
        >
          Add Event
        </h3>
        <form id="eventForm" class="space-y-4">
          <input type="hidden" id="eventId" />
          <div>
            <label
              class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1"
              >EVENT TITLE</label
            >
            <input
              type="text"
              id="eventTitle"
              required
              class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white"
              placeholder="Product Review Meeting..."
            />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label
                class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1"
                >DATE</label
              >
              <input
                type="date"
                id="eventDate"
                required
                class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white"
              />
            </div>
            <div>
              <label
                class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1"
                >CATEGORY / COLOR</label
              >
              <select
                id="eventColor"
                class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-white"
              >
                <option value="blue">Work (Blue)</option>
                <option value="green">Personal (Green)</option>
                <option value="purple">Education (Purple)</option>
                <option value="amber">Reminder (Amber)</option>
                <option value="rose">Urgent (Rose)</option>
              </select>
            </div>
          </div>
          <div
            class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-700"
          >
            <button
              type="button"
              id="deleteEventBtn"
              class="px-3 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 dark:bg-rose-900/30 dark:text-rose-400 rounded-lg text-sm font-medium hidden"
            >
              Delete
            </button>
            <div class="flex space-x-2 ml-auto">
              <button
                type="button"
                id="closeModalBtn"
                class="px-3 py-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-sm font-medium"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm"
              >
                Save Event
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
